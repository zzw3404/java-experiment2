<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>商品管理 · 数字贸易 MIS</title>
<link rel="stylesheet" href="style.css">
<header><strong>数字贸易 / 商品管理</strong><span id="session">未登录</span></header>
<main><section class="login" id="loginPanel"><h1>登录实验系统</h1><form id="login"><input name="username" value="admin" aria-label="账号" required><input name="password" type="password" placeholder="实验口令" aria-label="口令" required><button>登录</button><button type="button" class="secondary" id="probe">检查登录拦截</button></form></section>
<nav id="nav" hidden aria-label="业务模块">
<button data-view="dashboard">商品台账</button><button data-view="brands">品牌目录</button>
<button data-view="orders">订单查询</button><button data-view="lines">订单明细</button>
<button id="logout" class="secondary">退出</button></nav>
<div class="layout"><div><section id="dashboard" hidden><h1>商品台账</h1><form id="filter"><input name="name" placeholder="商品名称" aria-label="商品名称"><select name="status" aria-label="状态"><option value="">全部状态</option><option value="ON_SALE">在售</option><option value="OFF_SALE">下架</option></select><input name="category" placeholder="类别" aria-label="类别"><button>搜索</button><button type="button" id="all" class="secondary">全部商品</button><button type="button" id="batch" class="secondary">删除所选</button></form>
<table><thead><tr><th>选</th><th>编号</th><th>商品</th><th>类别</th><th>品牌</th><th>单价</th><th>库存</th><th>状态</th><th>操作</th></tr></thead><tbody id="products"></tbody></table><p><small id="total"></small></p></section>
<section id="editor" hidden><h2 id="editorTitle">新增商品</h2><form id="save"><input name="id" type="hidden"><input name="productName" placeholder="商品名称" aria-label="新增商品名称" required><input name="category" placeholder="类别" value="数码" required><input name="brandId" type="number" value="1" min="1" required aria-label="品牌编号"><input name="price" type="number" step="0.01" min="0" placeholder="单价" required><input name="stock" type="number" min="0" placeholder="库存" required><select name="saleStatus" aria-label="销售状态"><option value="ON_SALE">在售</option><option value="OFF_SALE">下架</option></select><button id="saveBtn">新增商品</button><button type="button" id="resetEditor" class="secondary" hidden>取消编辑</button></form></section>
<section id="brands" hidden><h1>品牌目录</h1><table><thead><tr><th>编号</th><th>品牌</th><th>网站</th><th>商品数</th></tr></thead><tbody id="brandRows"></tbody></table></section>
<section id="orders" hidden><h1>订单查询</h1><table><thead><tr><th>单号</th><th>客户</th><th>日期</th><th>状态</th><th>操作</th></tr></thead><tbody id="orderRows"></tbody></table></section>
<section id="lines" hidden><h1>订单明细</h1><form id="lineQuery"><input name="id" type="number" value="1" min="1" required aria-label="订单编号"><button>查明细</button></form><table><thead><tr><th>商品编号</th><th>商品</th><th>数量</th><th>成交价</th><th>小计</th></tr></thead><tbody id="lineRows"></tbody></table></section></div>
<section><h2>最近一次接口响应</h2><div id="endpoint">等待操作</div><p id="status" role="status"></p><pre id="response">请求结果会在这里显示。</pre></section></div></main>
<script src="app.js"></script></html>
